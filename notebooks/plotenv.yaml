name: plotenv
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy>=1.21
  - matplotlib>=3.5
  - seaborn>=0.12
  - scipy>=1.7
  - scikit-learn>=1.0
  - pandas>=1.3
  - h5py>=3.1
  - networkx>=2.6
  - intervaltree>=3.1
  - jupyter
  - notebook
  - ipykernel
  - ipython
  - plotly
  - tqdm
  - pip
  - pip:
    - kaleido==0.2.1